version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: placex_db
    environment:
      POSTGRES_DB: placex_db
      POSTGRES_USER: placex_user
      POSTGRES_PASSWORD: placex_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - placex_network

  # Django Backend
  django-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: placex_backend
    command: gunicorn place_x.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://placex_user:placex_password@db:5432/placex_db
      - ALLOWED_HOSTS=localhost,127.0.0.1
    depends_on:
      - db
    networks:
      - placex_network

  # React Frontend
  frontend-service:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: placex_frontend
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - django-service
    networks:
      - placex_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: placex_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "80:80"
    depends_on:
      - django-service
      - frontend-service
    networks:
      - placex_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  placex_network:
    driver: bridge
