version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: placex_db
    environment:
      POSTGRES_DB: placex_db
      POSTGRES_USER: placex_user
      POSTGRES_PASSWORD: placex_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placex_user -d placex_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: placex_web
    command: /start
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: placex_db
      DB_USER: placex_user
      DB_PASSWORD: placex_password
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: placex_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      VITE_BACKEND_URL: http://web:8000
    depends_on:
      - web

  nginx:
    image: nginx:alpine
    container_name: placex_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - frontend

  redis:
    image: redis:7.0-alpine
    container_name: placex_redis
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:6.0
    container_name: placex_mongodb
    ports:
      - "27017:27017"

volumes:
  postgres_data:
