name: Deploy PlaceX to EC2 (Free Tier)

on:
  push:
    branches: [Shivu]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/placex
            git fetch --all --prune
            git checkout Shivu
            git pull --ff-only origin Shivu
            if [ ! -f .env ]; then
              cp .env.prod.example .env
              echo "WARNING: .env was created from example - edit SECRET_KEY/ALLOWED_HOSTS/DB_PASSWORD"
            fi
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f